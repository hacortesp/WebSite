project:
  type: website
  output-dir: docs

website:
  page-navigation: true
  reader-mode: false
  title: "Henry A. Cortes"
  favicon: webpage_logo.png
  site-url: "https://matiasandina.netlify.app"
  repo-url: "https://github.com/hacortesp/WebSite/"
  repo-actions: [edit, issue]
  open-graph: true
  twitter-card:
    creator: "Henry Andrés Cortés"
    card-style: summary_large_image
  
  search:
    location: navbar
    type: overlay
    copy-button: true
    
  #page-footer:
    # using footer in _metadata
    #right: "This page is built with ❤️ and [Quarto](https://quarto.org/)."
    #left: "&copy; CC-By Matias Andina, 2023"
  
  navbar: 
    background: secondary
    search: true
    left:
      - text: "Research Areas"
        menu:
          - text: "Li-Oxygen Batteries"
            href: research/LiOxygen/index.html
          - text: "Li-ion Batteries"
            href: research/Li-ionBatteries/index.html
          - text: "Solid-state Batteries"
            href: research/Solid-stateBatteries/index.html
          - text: "Confined Fluids and Phase Equilibria"
            href: research/ConfinedFluids/index.html
      - href: publications/index.qmd
      - href: codes/index.qmd
        text: Software
      - text: "CV"
        href: CV/index.qmd
      #- text: "Past lives"
      #  file: past_lives/index.qmd
    right: 
      - icon: github
        href: https://github.com/hacortesp
      - icon: envelope
        href: mailto:hacortesp@bamath.org
      - text: "{{< ai orcid >}}" 
        href: https://orcid.org/0000-0002-2361-5193
      - text: "{{< ai google-scholar >}}"
        href: https://scholar.google.de/citations?hl=en&pli=1&user=Yqqj8fEAAAAJ


format:
  html:  
    theme:
      light: [cosmo, theme.scss] 
      dark: [cyborg, dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true
    # page formatting
    grid:
      #sidebar-width: 300px
      body-width: 900px
      margin-width: 300px
      gutter-width: 1.5rem
editor: visual
